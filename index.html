<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment WiFi Registration</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#f7f4ff);color:#172033;min-height:100vh}
  .wrap{max-width:720px;margin:auto;padding:32px 18px}.card{background:#fff;border-radius:24px;padding:30px;box-shadow:0 15px 45px rgba(30,50,90,.12)}
  h1{margin:0 0 8px;font-size:30px}.muted{color:#687386}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#eef4ff;color:#3565c8;font-weight:700;font-size:13px;margin-bottom:16px}
  label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #d8deea;border-radius:12px;font-size:16px}
  button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:22px;background:#2f6fed;color:white;font-size:16px;font-weight:800;cursor:pointer}
  button:disabled{opacity:.6}.error{color:#b42318;background:#fff0ef;padding:12px;border-radius:10px;margin-top:15px;display:none}
  .success{display:none}.credentials{margin-top:20px;background:#f4f8ff;border-radius:16px;padding:20px}.cred{font-size:20px;font-weight:800;margin:8px 0;word-break:break-word}
  .qr{display:none;text-align:center;margin-top:24px}.qr img{max-width:220px;border-radius:12px}
  .small{font-size:13px}.footer{margin-top:18px;text-align:center;color:#778096;font-size:13px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="badge" id="aptBadge">Apartment WiFi</div>
  <h1>Register for WiFi</h1>
  <p class="muted">Enter your email before receiving the WiFi credentials.</p>
  <form id="form">
    <label for="email">Email address</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label for="device">Device name</label>
    <input id="device" type="text" maxlength="100" placeholder="e.g. Maia's iPhone">
    <button id="submit">Get WiFi Credentials</button>
  </form>
  <div class="error" id="error"></div>
  <div class="success" id="success">
    <div class="credentials">
      <div class="muted small">Network name</div><div class="cred" id="network"></div>
      <div class="muted small">WiFi password</div><div class="cred" id="password"></div>
      <div class="muted small">Access expires</div><div class="cred" id="expires"></div>
    </div>
    <p class="muted small">Your registration has been recorded.</p>
  </div>
  <div class="qr" id="qr"><p class="muted">Share this portal</p><img id="qrImg" alt="QR code"></div>
  <div class="footer">WiFi Registration Portal</div>
</div></div>
<script>
const API_BASE = window.WIFI_API_BASE || 'http://localhost:3000';
const params = new URLSearchParams(location.search);
const apartment = params.get('apt') || 'apt-101';

document.getElementById('aptBadge').textContent = apartment.toUpperCase();

async function loadApartment(){
  try{
    const r = await fetch(`${API_BASE}/api/apartment/${encodeURIComponent(apartment)}`);
    if(!r.ok) throw new Error();
  }catch(e){
    // The form can still render; registration will show the backend error.
  }
  const portal = `${location.origin}${location.pathname}?apt=${encodeURIComponent(apartment)}`;
  document.getElementById('qrImg').src =
    `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(portal)}`;
  document.getElementById('qr').style.display = 'block';
}
loadApartment();

document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const button=document.getElementById('submit'), error=document.getElementById('error'), success=document.getElementById('success');
  error.style.display='none'; success.style.display='none'; button.disabled=true; button.textContent='Registering...';
  try{
    const r=await fetch(`${API_BASE}/api/register`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        apartment,
        email:document.getElementById('email').value,
        deviceName:document.getElementById('device').value
      })
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error || 'Registration failed.');
    document.getElementById('network').textContent=data.networkName;
    document.getElementById('password').textContent=data.wifiPassword;
    document.getElementById('expires').textContent=new Date(data.expires).toLocaleString();
    success.style.display='block';
    document.getElementById('form').style.display='none';
  }catch(err){
    error.textContent=err.message; error.style.display='block';
  }finally{button.disabled=false;button.textContent='Get WiFi Credentials'}
});
</script>
</body>
</html>
